  <title>Dashboard | ImgPDF — My Account</title>

  <link rel="canonical" href="https://thebhom.in/dashboard.html">

  <style>
    .dashboard-wrap {
      max-width: 1140px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 5rem;
    }
    .dash-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .dash-user-title {
      font-size: 1.65rem;
      font-weight: 800;
      color: var(--foreground);
      margin: 0;
      letter-spacing: -0.02em;
    }
    .dash-user-email {
      font-size: 0.9rem;
      color: var(--muted-foreground);
      margin-top: 0.2rem;
    }
    .dash-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .dash-stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin-bottom: 2.5rem;
    }
    @media (max-width: 768px) {
      .dash-stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    .dash-stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 1.25rem 1.5rem;
    }
    .dash-stat-label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: var(--muted-foreground);
      font-weight: 500;
    }
    .dash-stat-val {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--foreground);
      margin-top: 0.5rem;
      line-height: 1;
    }
    .dash-stat-sub {
      font-size: 0.85rem;
      font-weight: 400;
      color: var(--muted-foreground);
    }
    .dash-section-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--foreground);
      margin: 0 0 1rem;
    }
    .fav-tools-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      margin-bottom: 2.5rem;
    }
    .fav-tool-pill {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 0.6rem 1.1rem;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--foreground);
      text-decoration: none;
      transition: all 0.15s ease;
    }
    .fav-tool-pill:hover {
      border-color: #93c5fd;
      background: rgba(37, 99, 235, 0.04);
      color: #2563eb;
    }
    .recent-activity-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1rem;
      overflow: hidden;
    }
    .empty-activity {
      padding: 3rem 1.5rem;
      text-align: center;
      color: var(--muted-foreground);
    }
    .activity-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
      text-align: left;
    }
    .activity-table th {
      background: #f9fafb;
      padding: 0.75rem 1rem;
      font-weight: 600;
      color: var(--muted-foreground);
      border-bottom: 1px solid var(--border);
    }
    [data-theme="dark"] .activity-table th {
      background: #18191d;
    }
    .activity-table td {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border);
      color: var(--foreground);
    }
    .activity-table tr:last-child td {
      border-bottom: none;
    }
    .activity-table tr:hover {
      background: rgba(0,0,0,0.015);
    }
  </style>
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-M5CB7P73"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->
  <div id="site-header"></div>

  <main class="dashboard-wrap">
    <!-- Topbar -->
    <div class="dash-topbar">
      <div>
        <h1 class="dash-user-title" id="userName">My Account</h1>
        <p class="dash-user-email" id="userEmail">Loading profile...</p>
      </div>
      <div class="dash-actions">
        <span class="badge" id="planBadge" style="display:inline-flex;align-items:center;gap:4px;padding:5px 12px;font-size:0.8rem;background:#f3f4f6;color:#4b5563;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/></svg>
          <span id="planName">FREE</span>
        </span>
        <button id="authActionBtn" onclick="handleLogout()" class="btn-secondary" style="display:inline-flex;align-items:center;gap:6px;padding:6px 14px;font-size:0.85rem;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Logout
        </button>
      </div>
    </div>

    <!-- 4 Stats Cards -->
    <div class="dash-stats-grid">
      <div class="dash-stat-card">
        <div class="dash-stat-label">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          Today
        </div>
        <div class="dash-stat-val" id="statToday">0 <span class="dash-stat-sub">/ 500</span></div>
      </div>

      <div class="dash-stat-card">
        <div class="dash-stat-label">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          Total Processed
        </div>
        <div class="dash-stat-val" id="statTotal">0</div>
      </div>

      <div class="dash-stat-card">
        <div class="dash-stat-label">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="12" x2="2" y2="12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><line x1="6" y1="16" x2="6.01" y2="16"/><line x1="10" y1="16" x2="10.01" y2="16"/></svg>
          Storage Used
        </div>
        <div class="dash-stat-val" id="statStorage">0 B</div>
      </div>

      <div class="dash-stat-card">
        <div class="dash-stat-label">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="none" style="color:#eab308;"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          Favorites
        </div>
        <div class="dash-stat-val" id="statFavs">5</div>
      </div>
    </div>

    <!-- Favorite Tools -->
    <h2 class="dash-section-title">Favorite Tools</h2>
    <div class="fav-tools-list">
      <a href="tools/pdf-to-image.html" class="fav-tool-pill">PDF to Image</a>
      <a href="tools/merge-pdf.html" class="fav-tool-pill">Merge PDF</a>
      <a href="tools/index.html#pdf" class="fav-tool-pill">PDF Tools</a>
      <a href="tools/compress-image.html" class="fav-tool-pill">Compress Image</a>
      <a href="tools/ai.html" class="fav-tool-pill">AI Assistant</a>
      <a href="downloader/" class="fav-tool-pill">Video Downloader</a>
    </div>

    <!-- Recent Activity -->
    <h2 class="dash-section-title">Recent Activity</h2>
    <div class="recent-activity-card">
      <div id="emptyActivity" class="empty-activity">
        <p>No processing history yet.</p>
        <a href="tools/index.html" class="btn-primary" style="display:inline-flex;padding:0.6rem 1.25rem;font-size:0.875rem;margin-top:1rem;">Start Processing</a>
      </div>

      <div id="tableWrapper" style="display:none;overflow-x:auto;">
        <table class="activity-table">
          <thead>
            <tr>
              <th>File</th>
              <th>Tool</th>
              <th>Status</th>
              <th>Size</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="activityRows"></tbody>
        </table>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script>
    function loadUserData() {
      try {
        const stored = JSON.parse(localStorage.getItem('thebhom_user') || '{}');
        const email = stored.email || '';
        const name = stored.name || (email ? email.split('@')[0] : 'Guest User');
        const plan = stored.plan || 'FREE';
        const isPending = stored.status === 'pending';

        document.getElementById('userName').textContent = `Welcome, ${name}`;
        document.getElementById('userEmail').textContent = email || 'Guest Mode (Sign in to sync your Pro plan)';
        document.getElementById('planName').textContent = isPending ? `${plan} (Pending Approval)` : plan;

        const badge = document.getElementById('planBadge');
        if (isPending) {
          badge.className = 'badge';
          badge.style.background = '#fef3c7';
          badge.style.color = '#b45309';
        } else if (plan === 'PRO') {
          badge.className = 'badge badge-pro';
          badge.style.background = '';
          badge.style.color = '';
        } else if (plan === 'BUSINESS') {
          badge.className = 'badge badge-ai';
          badge.style.background = '';
          badge.style.color = '';
        } else {
          badge.className = 'badge';
          badge.style.background = '#f3f4f6';
          badge.style.color = '#4b5563';
        }

        const authBtn = document.getElementById('authActionBtn');
        if (!email) {
          authBtn.textContent = 'Sign In / Register';
          authBtn.className = 'btn-primary';
          authBtn.onclick = () => { if (typeof openAuthModal === 'function') openAuthModal(); };
        } else {
          authBtn.className = 'btn-secondary';
          authBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Logout`;
          authBtn.onclick = handleLogout;

          // Check live status if email exists
          fetch(`/api/orders?email=${encodeURIComponent(email)}`)
            .then(res => res.json())
            .then(data => {
              if (data && data.found && data.order) {
                const ord = data.order;
                if (ord.isApproved) {
                  const upgradedPlan = (ord.productName || ord.productId || 'PRO').toUpperCase().includes('BUSINESS') ? 'BUSINESS' : 'PRO';
                  stored.plan = upgradedPlan;
                  stored.status = 'approved';
                  stored.licenseKey = ord.licenseKey;
                  localStorage.setItem('thebhom_user', JSON.stringify(stored));
                  document.getElementById('planName').textContent = upgradedPlan;
                  badge.className = upgradedPlan === 'BUSINESS' ? 'badge badge-ai' : 'badge badge-pro';
                  badge.style.background = '';
                  badge.style.color = '';
                }
              }
            })
            .catch(() => {});
        }

        // Check local activity logs if present
        const jobs = JSON.parse(localStorage.getItem('thebhom_jobs') || '[]');
        if (jobs.length > 0) {
          document.getElementById('emptyActivity').style.display = 'none';
          document.getElementById('tableWrapper').style.display = 'block';
          document.getElementById('statTotal').textContent = jobs.length;
          document.getElementById('statToday').innerHTML = `${jobs.length} <span class="dash-stat-sub">/ ${plan === 'FREE' ? 10 : 500}</span>`;

          const rows = document.getElementById('activityRows');
          rows.innerHTML = jobs.map(j => `
            <tr>
              <td style="font-weight:600;">${j.file || 'document.pdf'}</td>
              <td>${j.tool || 'PDF Converter'}</td>
              <td><span class="badge badge-new">${j.status || 'completed'}</span></td>
              <td style="color:var(--muted-foreground);">${j.size || '1.2 MB'}</td>
              <td style="color:var(--muted-foreground);">${new Date(j.date || Date.now()).toLocaleDateString()}</td>
            </tr>
          `).join('');
        }
      } catch(e){}
    }

    function handleLogout() {
      localStorage.removeItem('thebhom_user');
      window.location.href = 'index.html';
    }

    window.addEventListener('DOMContentLoaded', loadUserData);
  </script>
</body>
</html>
