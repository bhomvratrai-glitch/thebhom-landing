<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#31104b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="100" fill="none" stroke="url(#gold)" stroke-width="4" opacity="0.4"/>
  
  <!-- Ambient glow circle -->
  <circle cx="256" cy="256" r="160" fill="url(#cyan)" opacity="0.12" filter="url(#glow)"/>
  
  <!-- Central Stylized 'B' Monogram & Book/Crown Motif -->
  <path d="M160 120 H280 C340 120 370 150 370 195 C370 230 345 250 310 256 C355 264 380 290 380 335 C380 385 340 412 275 412 H160 V120 Z M225 175 V230 H270 C295 230 310 218 310 202 C310 186 295 175 270 175 H225 Z M225 285 V355 H275 C305 355 320 342 320 320 C320 298 305 285 275 285 H225 Z" fill="url(#gold)" filter="url(#glow)"/>
  
  <!-- Modern Sparkles -->
  <circle cx="390" cy="130" r="8" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="120" cy="370" r="6" fill="#f472b6"/>
  <circle cx="380" cy="390" r="10" fill="#fbbf24"/>
  
  <!-- Category Icons Arc -->
  <text x="256" y="460" font-family="'Inter', sans-serif" font-size="24" font-weight="800" fill="#e2e8f0" text-anchor="middle" letter-spacing="4">THEBHOM.IN</text>
</svg>