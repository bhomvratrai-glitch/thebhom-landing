name: Build SEO Directory

on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_directory.py'
      - '.github/workflows/build-directory.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Directory Pages
        run: python scripts/generate_directory.py directory

      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add directory/
          git diff --cached --quiet || git commit -m "🤖 Auto-generate SEO directory (1159 pages) [skip ci]"
          git push
